# =============================================================================
# OJP Release Workflow — One-Click Release to Maven Central & Docker Hub
# =============================================================================
#
# OVERVIEW
# --------
# This workflow automates the full release cycle for all OJP modules:
#
#   1. Validates required secrets are configured
#   2. Validates Docker Hub credentials (fast-fail before any version changes)
#   3. Checks out the repository
#   4. Sets up JDK and Maven settings
#   5. Computes the release version and the next development version
#      (see VERSION SCHEME below for details)
#   6. Bumps all pom.xml versions to the release version
#   7. Builds all Maven modules (no tests)
#   8. Deploys all library modules to Maven Central via Sonatype Central
#   9. Builds and pushes the OJP Server Docker image to Docker Hub
#  10. Updates all documentation to reference the new release version
#  11. Creates a signed Git tag on the release commit
#  12. Bumps all pom.xml versions to the next development version
#  13. Commits and pushes all changes back to the current branch
#  14. Creates a GitHub Release with auto-generated release notes
#      (based on merged PRs since the previous tag, categorised by label
#       as defined in .github/release.yml)
#
# VERSION SCHEME
# --------------
# From 1.0.0 onwards, release versions are plain semver with no suffix:
#   1.0.0-SNAPSHOT  →  released as  1.0.0  →  next dev  (see below)
#
# BRANCH-AWARE NEXT-VERSION LOGIC:
#   main branch after a X.Y.0 release:
#     1.0.0-SNAPSHOT → release 1.0.0 → next dev 1.1.0-SNAPSHOT
#     2.0.0-SNAPSHOT → release 2.0.0 → next dev 2.1.0-SNAPSHOT
#   main branch after a X.Y.Z release (Z > 0):
#     1.1.1-SNAPSHOT → release 1.1.1 → next dev 1.1.2-SNAPSHOT
#   lts/X.Y branch always increments PATCH only:
#     1.0.1-SNAPSHOT → release 1.0.1 → next dev 1.0.2-SNAPSHOT
#     1.0.8-SNAPSHOT → release 1.0.8 → next dev 1.0.9-SNAPSHOT
#
# PRE-RELEASE VERSIONS (RC / SNAPSHOT-numbered):
#   Release candidates and numbered snapshots are supported via release_version:
#     release_version=1.0.0-RC1     → publish 1.0.0-RC1, no version bump, no 'latest' Docker tag
#     release_version=1.0.0-RC2     → publish 1.0.0-RC2, no version bump, no 'latest' Docker tag
#     release_version=1.0.0-SNAPSHOT1 → publish 1.0.0-SNAPSHOT1, no version bump
#   After the pre-release validates, trigger the workflow again with no override to
#   publish the final GA version and perform the normal SNAPSHOT → next-dev bump.
#   Pre-releases are marked as GitHub pre-releases automatically.
#
# LTS BRANCH VALIDATION:
#   On lts/X.Y, only X.Y.z (and X.Y.z-qualifier) versions are allowed.
#   Attempting to release 1.1.0 from lts/1.0 is rejected with a clear error.
#
# EXPLICIT RELEASE VERSION:
#   Supply release_version to override the computed version.
#   On main: any valid semver (plain or with qualifier) is accepted.
#   On lts/X.Y: only X.Y.z or X.Y.z-qualifier is accepted.
#   For plain GA versions the next development version is derived automatically.
#   For pre-release versions no version bump is performed.
#
# REQUIRED GITHUB SECRETS
# -----------------------
#   SONATYPE_USERNAME   Sonatype Central user-token username  (NOT your account username)
#   SONATYPE_PASSWORD   Sonatype Central user-token password
#   GPG_PRIVATE_KEY     ASCII-armored GPG private key (export: gpg --armor --export-secret-keys KEY_ID)
#   GPG_PASSPHRASE      Passphrase for the GPG key
#   DOCKERHUB_USER      Docker Hub username (currently: rrobetti)
#   DOCKERHUB_TOKEN     Docker Hub access token (Settings → Security → Access Tokens)
#   RELEASE_TOKEN       PAT with repo+workflow scope (required to push workflow file changes)
#
# HOW TO TRIGGER
# --------------
#   GitHub UI → Actions → "Release to Maven Central & Docker Hub" → Run workflow
#   Check "Dry run" to validate the version calculation and build without publishing.
#   Optionally provide "Release version" to override the computed release version,
#   e.g. "2.0.0" for a major version bump regardless of the current pom version.
#
# =============================================================================

name: Release to Maven Central & Docker Hub

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — build & version bump only, skip publishing and push'
        required: false
        default: 'false'
        type: boolean
      release_version:
        description: 'Optional release version override (e.g. 1.2.0, 2.0.0). Leave blank to auto-derive from the current pom SNAPSHOT version.'
        required: false
        default: ''
        type: string

jobs:
  release:
    name: Release OJP
    runs-on: ubuntu-latest
    # Requires manual approval by rrobetti before the job starts.
    # Configure the "release" environment in repository Settings → Environments
    # with rrobetti as a required reviewer.
    environment: release
    # Minimal required permissions for this workflow
    permissions:
      contents: write   # push commits, create tags and create GitHub releases
      # Note: updating .github/workflows/main.yml requires RELEASE_TOKEN (PAT with 'workflow' scope)
    # Prevent concurrent releases that could corrupt the version state
    concurrency:
      group: release
      cancel-in-progress: false

    steps:

      # -----------------------------------------------------------------------
      # 1. Validate required secrets (fast-fail before any version changes)
      # -----------------------------------------------------------------------
      - name: Validate required secrets
        if: ${{ inputs.dry_run == false }}
        run: |
          missing=()
          [[ -z "${{ secrets.SONATYPE_USERNAME }}"  ]] && missing+=("SONATYPE_USERNAME")
          [[ -z "${{ secrets.SONATYPE_PASSWORD }}"  ]] && missing+=("SONATYPE_PASSWORD")
          [[ -z "${{ secrets.GPG_PRIVATE_KEY }}"    ]] && missing+=("GPG_PRIVATE_KEY")
          [[ -z "${{ secrets.GPG_PASSPHRASE }}"     ]] && missing+=("GPG_PASSPHRASE")
          [[ -z "${{ secrets.DOCKERHUB_USER }}"     ]] && missing+=("DOCKERHUB_USER")
          [[ -z "${{ secrets.DOCKERHUB_TOKEN }}"    ]] && missing+=("DOCKERHUB_TOKEN")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: The following required secrets are not configured:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            echo "" >&2
            echo "See documents/guides/RELEASE_PROCESS.md for setup instructions." >&2
            exit 1
          fi
          echo "All required secrets are present."

      # -----------------------------------------------------------------------
      # 2. Validate Docker Hub credentials (fast-fail before any version changes)
      # -----------------------------------------------------------------------
      - name: Validate Docker Hub credentials
        if: ${{ inputs.dry_run == false }}
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            --username "${{ secrets.DOCKERHUB_USER }}" \
            --password-stdin
          docker logout
          echo "Docker Hub credentials verified successfully."

      # -----------------------------------------------------------------------
      # 3. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # A PAT with 'repo' AND 'workflow' scope is required: 'repo' to push
          # version-bump commits back to main, and 'workflow' because the release
          # process updates the docker image tag in .github/workflows/main.yml.
          # GITHUB_TOKEN cannot push workflow file changes.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 4. Java + Maven settings (server credentials + GPG key import)
      # -----------------------------------------------------------------------
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven
          # Maven settings.xml will be generated with a <server> entry whose
          # id matches <publishingServerId>central</publishingServerId> in pom.xml
          server-id: central
          server-username: SONATYPE_USERNAME
          server-password: SONATYPE_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Configure Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # -----------------------------------------------------------------------
      # 5. Compute release and next-development versions
      # -----------------------------------------------------------------------
      - name: Compute versions
        id: versions
        run: |
          # ── Determine current branch ────────────────────────────────────────
          BRANCH="${GITHUB_REF_NAME}"
          echo "Branch: ${BRANCH}"

          # ── Detect if this is an LTS branch (lts/X.Y) ─────────────────────
          LTS_BRANCH=false
          LTS_MAJOR=""
          LTS_MINOR=""
          if echo "${BRANCH}" | grep -qE '^lts/[0-9]+\.[0-9]+$'; then
            LTS_BRANCH=true
            LTS_MAJOR=$(echo "${BRANCH}" | cut -d/ -f2 | cut -d. -f1)
            LTS_MINOR=$(echo "${BRANCH}" | cut -d/ -f2 | cut -d. -f2)
            echo "LTS branch detected: ${BRANCH} (allowed line: ${LTS_MAJOR}.${LTS_MINOR}.x)"
          fi

          # ── Read current pom version ────────────────────────────────────────
          CURRENT=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Current version: ${CURRENT}"

          # ── Determine release version ───────────────────────────────────────
          IS_PRERELEASE=false
          if [[ -n "${{ inputs.release_version }}" ]]; then
            RELEASE="${{ inputs.release_version }}"
            echo "Using provided release version: ${RELEASE}"

            # Validate format: plain X.Y.Z  OR  X.Y.Z-<qualifier>
            # Qualifier must start with a letter (e.g. RC1, RC2, SNAPSHOT1, alpha1)
            if ! echo "${RELEASE}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z][A-Za-z0-9]*)?$'; then
              echo "ERROR: release_version '${RELEASE}' must be X.Y.Z or X.Y.Z-<qualifier> (e.g. 1.2.0, 1.0.0-RC1)." >&2
              exit 1
            fi

            # Detect pre-release (qualifier present)
            if echo "${RELEASE}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-'; then
              IS_PRERELEASE=true
              echo "Pre-release version detected: ${RELEASE} (no version bump will be performed)"
            fi
          else
            # Auto-derive from SNAPSHOT: only plain X.Y.Z-SNAPSHOT is allowed here
            if [[ "${CURRENT}" != *"-SNAPSHOT" ]]; then
              echo "ERROR: Current version '${CURRENT}' does not end in -SNAPSHOT." >&2
              echo "Only SNAPSHOT versions can be released automatically, or provide a custom release version." >&2
              exit 1
            fi
            RELEASE="${CURRENT%-SNAPSHOT}"

            # Validate that the auto-derived release is a plain X.Y.Z
            if ! echo "${RELEASE}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "ERROR: Auto-derived release version '${RELEASE}' is not a valid semver X.Y.Z." >&2
              exit 1
            fi
          fi

          # ── Extract numeric base (X.Y.Z) from release version ──────────────
          # For pre-releases like 1.0.0-RC1, we need 1.0.0 for LTS validation
          # and next-version logic (not used for pre-releases but extracted anyway)
          BASE_RELEASE="${RELEASE%%-*}"
          REL_MAJOR=$(echo "${BASE_RELEASE}" | cut -d. -f1)
          REL_MINOR=$(echo "${BASE_RELEASE}" | cut -d. -f2)
          REL_PATCH=$(echo "${BASE_RELEASE}" | cut -d. -f3)

          # ── Validate release version against LTS branch constraint ──────────
          if [[ "${LTS_BRANCH}" == "true" ]]; then
            if [[ "${REL_MAJOR}" != "${LTS_MAJOR}" || "${REL_MINOR}" != "${LTS_MINOR}" ]]; then
              echo "ERROR: Branch '${BRANCH}' only allows ${LTS_MAJOR}.${LTS_MINOR}.x releases." >&2
              echo "       Attempted release version: ${RELEASE}" >&2
              exit 1
            fi
          fi

          # ── Check that the release tag does not already exist ───────────────
          if git ls-remote --tags origin "refs/tags/v${RELEASE}" | grep -q "refs/tags/v${RELEASE}"; then
            echo "ERROR: Tag v${RELEASE} already exists. Did you forget to bump the version?" >&2
            exit 1
          fi

          # ── Compute next development version ────────────────────────────────
          # Pre-releases: no version bump — NEXT equals CURRENT (pom is reverted after publish)
          # LTS branch: always increment patch only
          # main branch after X.Y.0 release: bump minor (new feature cycle)
          # main branch after X.Y.Z (Z > 0): increment patch
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            NEXT="${CURRENT}"
          elif [[ "${LTS_BRANCH}" == "true" ]]; then
            NEXT_PATCH=$((REL_PATCH + 1))
            NEXT="${REL_MAJOR}.${REL_MINOR}.${NEXT_PATCH}-SNAPSHOT"
          elif [[ "${BRANCH}" == "main" && "${REL_PATCH}" == "0" ]]; then
            NEXT_MINOR=$((REL_MINOR + 1))
            NEXT="${REL_MAJOR}.${NEXT_MINOR}.0-SNAPSHOT"
          else
            NEXT_PATCH=$((REL_PATCH + 1))
            NEXT="${REL_MAJOR}.${REL_MINOR}.${NEXT_PATCH}-SNAPSHOT"
          fi

          echo "Release version : ${RELEASE}"
          echo "Next dev version: ${NEXT}"
          echo "Is pre-release  : ${IS_PRERELEASE}"

          echo "current=${CURRENT}"            >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}"            >> "$GITHUB_OUTPUT"
          echo "next=${NEXT}"                  >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}"              >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 6. Set release version in all pom.xml files
      # -----------------------------------------------------------------------
      - name: Set release version (${{ steps.versions.outputs.release }})
        run: |
          mvn --batch-mode versions:set \
              -DnewVersion=${{ steps.versions.outputs.release }} \
              -DprocessAllModules=true \
              -DgenerateBackupPoms=false \
              --no-transfer-progress

      # -----------------------------------------------------------------------
      # 7. Build all modules (no tests) to validate the release
      # -----------------------------------------------------------------------
      - name: Build all modules (no tests)
        run: |
          mvn --batch-mode clean package \
              -DskipTests \
              -Dgpg.skip=true \
              --no-transfer-progress

      # -----------------------------------------------------------------------
      # 8. Deploy all modules to Maven Central (libraries + ojp-server executable JAR)
      # -----------------------------------------------------------------------
      - name: Deploy to Maven Central
        if: ${{ inputs.dry_run == false }}
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn --batch-mode deploy \
              -DskipTests \
              -Prelease \
              --no-transfer-progress

      # -----------------------------------------------------------------------
      # 9. Build and push Docker image for ojp-server
      #    Image tag is the release version (e.g. rrobetti/ojp:0.4.1-beta)
      #    Also tagged as latest.
      #    Fat JAR is already built by step 7 (mvn clean package).
      # -----------------------------------------------------------------------
      - name: Download open source JDBC drivers
        if: ${{ inputs.dry_run == false }}
        run: bash ojp-server/download-drivers.sh ./ojp-server/ojp-libs

      - name: Log in to Docker Hub
        if: ${{ inputs.dry_run == false }}
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin

      - name: Build and push Docker image (${{ steps.versions.outputs.release }})
        if: ${{ inputs.dry_run == false }}
        run: |
          IMAGE="rrobetti/ojp:${{ steps.versions.outputs.release }}"
          docker build -t "$IMAGE" ojp-server/
          docker push "$IMAGE"
          # Only tag as 'latest' for GA releases, not pre-releases (RC, SNAPSHOT-numbered, etc.)
          if [[ "${{ steps.versions.outputs.is_prerelease }}" != "true" ]]; then
            docker tag "$IMAGE" rrobetti/ojp:latest
            docker push rrobetti/ojp:latest
          fi

      # -----------------------------------------------------------------------
      # 10. Update version references in all documentation (*.md files)
      #     Replaces:  rrobetti/ojp:<old>   →  rrobetti/ojp:<new>
      #                ojp-server-<old>     →  ojp-server-<new>  (filenames + URLs)
      #                /ojp-server/<old>/   →  /ojp-server/<new>/  (Maven Central URL path)
      #                <version><old></version>  →  <version><new></version>
      # -----------------------------------------------------------------------
      - name: Update documentation to ${{ steps.versions.outputs.release }}
        run: |
          NEW="${{ steps.versions.outputs.release }}"
          echo "Updating documentation references to ${NEW}"

          # Replace any prior X.Y.Z (with optional -beta suffix) with the new GA version
          find . -name "*.md" -not -path './.git/*' -print0 | xargs -0 sed -i \
            -e "s|rrobetti/ojp:[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\(-beta\)\?|rrobetti/ojp:${NEW}|g" \
            -e "s|ojp-server-[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\(-beta\)\?|ojp-server-${NEW}|g" \
            -e "s|/ojp-server/[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\(-beta\)\?/|/ojp-server/${NEW}/|g" \
            -e "s|<version>[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\(-beta\)\?</version>|<version>${NEW}</version>|g"

          echo "Files updated:"
          git diff --name-only

      # -----------------------------------------------------------------------
      # 11. Commit release (pom changes + docs update) and create tag
      # -----------------------------------------------------------------------
      - name: Commit release pom changes and create tag
        if: ${{ inputs.dry_run == false }}
        run: |
          git add -A -- ':!**/target/**'
          git commit -m "chore(release): prepare release ${{ steps.versions.outputs.release }}"
          git tag -a "v${{ steps.versions.outputs.release }}" \
              -m "Release ${{ steps.versions.outputs.release }}"

      # -----------------------------------------------------------------------
      # 12. Set next development (SNAPSHOT) version
      #     Skipped for pre-releases (RC, SNAPSHOT-numbered, etc.) — the pom
      #     stays at the current SNAPSHOT version so the repository state is
      #     unchanged after a pre-release publication.
      # -----------------------------------------------------------------------
      - name: Set next development version (${{ steps.versions.outputs.next }})
        if: ${{ steps.versions.outputs.is_prerelease == 'false' }}
        run: |
          mvn --batch-mode versions:set \
              -DnewVersion=${{ steps.versions.outputs.next }} \
              -DprocessAllModules=true \
              -DgenerateBackupPoms=false \
              --no-transfer-progress

      - name: Commit next development version
        if: ${{ inputs.dry_run == false && steps.versions.outputs.is_prerelease == 'false' }}
        run: |
          git add -A -- ':!**/target/**'
          git commit -m "chore(release): prepare next development iteration ${{ steps.versions.outputs.next }}"

      # -----------------------------------------------------------------------
      # 13. Push commits and release tag to the current branch
      # -----------------------------------------------------------------------
      - name: Push commits and tag
        if: ${{ inputs.dry_run == false }}
        run: |
          git push origin HEAD:${{ steps.versions.outputs.branch }}
          git push origin "v${{ steps.versions.outputs.release }}"

      # -----------------------------------------------------------------------
      # 14. Create GitHub Release from the new tag
      #     Release notes are generated automatically from merged pull requests
      #     since the previous release, categorised by label as defined in
      #     .github/release.yml.  A fixed "Artifacts" footer is appended.
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        if: ${{ inputs.dry_run == false }}
        uses: actions/github-script@v7
        with:
          script: |
            const tag   = 'v${{ steps.versions.outputs.release }}';
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            // Generate release notes from merged PRs since the previous tag.
            // Categories are controlled by .github/release.yml.
            const { data: generated } = await github.rest.repos.generateReleaseNotes({
              owner,
              repo,
              tag_name:         tag,
              target_commitish: '${{ steps.versions.outputs.branch }}',
            });

            // Append a fixed artifacts footer to the auto-generated body.
            const artifactsFooter = [
              '',
              '---',
              '',
              '### 📦 Artifacts',
              `- **Maven Central:** [org.openjproxy](https://central.sonatype.com/search?q=org.openjproxy&smo=true)`,
              `- **Docker Hub:** [rrobetti/ojp:${{ steps.versions.outputs.release }}](https://hub.docker.com/r/rrobetti/ojp)`,
            ].join('\n');

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name:    tag,
              name:        generated.name,
              body:        generated.body + artifactsFooter,
              draft:       false,
              prerelease:  ${{ steps.versions.outputs.is_prerelease }},
              make_latest: ${{ steps.versions.outputs.is_prerelease }} ? 'false' : 'true',
            });

      # -----------------------------------------------------------------------
      # Summary
      # -----------------------------------------------------------------------
      - name: Release summary
        run: |
          echo "### Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "**Mode:** Dry run (nothing was published)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Mode:** Full release" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Previous version | \`${{ steps.versions.outputs.current }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Released version | \`${{ steps.versions.outputs.release }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Next dev version | \`${{ steps.versions.outputs.next }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Maven Central:** https://central.sonatype.com/search?q=org.openjproxy" >> "$GITHUB_STEP_SUMMARY"
          echo "**Docker Hub:** https://hub.docker.com/r/rrobetti/ojp" >> "$GITHUB_STEP_SUMMARY"
