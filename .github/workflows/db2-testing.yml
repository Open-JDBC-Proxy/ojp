# This workflow runs IBM DB2 Database tests autonomously without requiring DB2 JDBC drivers in the repository.
# It dynamically adds the DB2 JDBC driver during CI execution and runs DB2-specific tests.
# Note: DB2 requires significant resources (6GB memory, privileged mode) and long startup time (15+ minutes).
name: IBM DB2 Database Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  db2-test:
    name: DB2 Tests (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        java-version: [ 11, 17, 21, 22 ]

    services:
      db2:
        # DB2 Database 11.5.8.0 - compatible with JDBC driver 11.5.9.0 (newer driver version is supported)
        image: ibmcom/db2:11.5.8.0
        env:
          LICENSE: accept
          DB2INSTANCE: db2inst1
          DB2INST1_PASSWORD: testpass
          DBNAME: testdb
          BLU: false
          ENABLE_ORACLE_COMPATIBILITY: false
          UPDATEAVAIL: NO
          TO_CREATE_SAMPLEDB: false
          REPODB: false
          IS_OSXFS: false
          PERSISTENT_HOME: false
          HADR_ENABLED: false
        options: >-
          --name ojp-db2
          --privileged
          --memory 6g
          --health-cmd "su - db2inst1 -c 'db2 connect to testdb && db2 select 1 from sysibm.sysdummy1'"
          --health-interval 60s
          --health-timeout 30s
          --health-retries 20
        ports:
          - 50000:50000

    steps:

      - name: Git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for DB2 to be fully ready
        run: |
          echo "Waiting for DB2 to fully initialize (this may take 15+ minutes)..."

          # Wait for initial startup (DB2 requires significant time for first-time initialization)
          # This prevents premature polling attempts that could fill logs with connection errors
          sleep 180

          # Poll DB2 until it's ready (max 20 minutes total: 60 attempts × 20s)
          COUNTER=0
          MAX_ATTEMPTS=60

          until docker exec ojp-db2 su - db2inst1 -c "db2 connect to testdb" > /dev/null 2>&1; do
            COUNTER=$((COUNTER+1))
            if [ $COUNTER -eq $MAX_ATTEMPTS ]; then
              echo "ERROR: DB2 failed to start after $MAX_ATTEMPTS attempts (20 minutes)"
              echo "=== DB2 container logs ==="
              docker logs ojp-db2
              echo "=== Attempting final connection for detailed error ==="
              docker exec ojp-db2 su - db2inst1 -c "db2 connect to testdb" || true
              exit 1
            fi
            echo "Waiting for DB2... attempt $COUNTER/$MAX_ATTEMPTS"
            sleep 20
          done

          echo "=== DB2 is ready ==="

          # Verify connection and test basic query
          docker exec ojp-db2 su - db2inst1 -c "db2 connect to testdb && db2 'select 1 from sysibm.sysdummy1'"

      - name: Add IBM DB2 JDBC Driver to ojp-server
        run: |
          # Create temporary file with DB2 JDBC dependency
          # Note: Using 8-space indentation to match existing pom.xml structure
          {
            echo "        <!-- IBM DB2 JDBC Driver (added by CI) -->"
            echo "        <dependency>"
            echo "            <groupId>com.ibm.db2</groupId>"
            echo "            <artifactId>jcc</artifactId>"
            echo "            <version>11.5.9.0</version>"
            echo "        </dependency>"
          } > /tmp/db2-dep.txt

          # Insert after the placeholder comment
          sed -i '/<!-- PROPRIETARY DATABASE DRIVERS PLACEHOLDER -->/r /tmp/db2-dep.txt' ojp-server/pom.xml

          # Verify the insertion
          echo "=== Modified ojp-server/pom.xml dependencies section ==="
          sed -n '/PROPRIETARY DATABASE DRIVERS PLACEHOLDER/,/HikariCP/p' ojp-server/pom.xml

      - name: Set up JDK 22 for build
        uses: actions/setup-java@v4
        with:
          java-version: 22
          distribution: 'temurin'
          cache: maven

      - name: Build and Install (ojp-grpc-commons) with JDK 22
        run: mvn clean install -pl ojp-grpc-commons -am -DskipTests -Dgpg.skip=true

      - name: Test (ojp-grpc-commons) with JDK 22
        run: mvn test -pl ojp-grpc-commons -Dgpg.skip=true

      - name: Build (ojp-server) with JDK 22
        run: mvn clean install -pl ojp-server -am -DskipTests -Dgpg.skip=true

      - name: Test and Run (ojp-server)
        run: |
          nohup java -jar ojp-server/target/ojp-server-0.2.1-snapshot-shaded.jar > /tmp/ojp-server.log 2>&1 &
          echo $! > /tmp/ojp-server.pid

      - name: Wait for ojp-server to start
        run: sleep 10

      - name: Set up JDK ${{ matrix.java-version }} for ojp-jdbc-driver
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Build (ojp-jdbc-driver) with JDK ${{ matrix.java-version }}
        run: mvn clean install -pl ojp-jdbc-driver -am -DskipTests -Dgpg.skip=true

      - name: Test (ojp-jdbc-driver) with DB2 enabled
        run: mvn test -pl ojp-jdbc-driver -Dgpg.skip=true -DenableDb2Tests -DdisablePostgresTests -DdisableMySQLTests -DdisableMariaDBTests -DdisableCockroachDBTests

      - name: Show ojp-server.log
        if: always()  # ensures it runs even if previous steps fail
        run: cat /tmp/ojp-server.log || echo "/tmp/ojp-server.log not found"
