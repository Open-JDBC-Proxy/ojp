# This workflow builds and pushes the Docker image for the OJP server.
name: OJP Server Docker Image Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: true
        default: 'latest'
      repository:
        description: 'Repository name'
        required: true
        default: 'rrobetti'

jobs:
  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          java-version: 24
          distribution: 'temurin'
          cache: maven

      - name: Build fat JAR
        run: mvn package -pl ojp-server -am -DskipTests -Dgpg.skip=true

      - name: Download open source JDBC drivers
        run: bash ojp-server/download-drivers.sh ./ojp-server/ojp-libs

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE="${{ github.event.inputs.repository }}/ojp:${{ github.event.inputs.tag }}"
          docker build -t "$IMAGE" ojp-server/
          docker push "$IMAGE"
