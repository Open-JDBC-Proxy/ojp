# This workflow tests multinode XA functionality with two OJP server instances
# It starts a Postgres database with XA support (max_prepared_transactions) and two OJP servers,
# then runs XA integration tests for multinode scenarios with distributed transactions.
name: Multinode XA Integration Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  EXPECTED_ATOMIKOS_MAX_POOL: 20

jobs:
  multinode-xa-test:
    name: Multinode XA Integration Test
    runs-on: ubuntu-latest

    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start Postgres with XA support
        run: |
          docker run --name ojp-postgres-multinode-xa \
            -e POSTGRES_USER=testuser \
            -e POSTGRES_PASSWORD=testpassword \
            -e POSTGRES_DB=defaultdb \
            -p 5432:5432 \
            -d postgres:17 \
            -c max_prepared_transactions=100
      
          # Wait for Postgres to become ready (up to 60s)
          timeout 60 bash -c 'until docker exec ojp-postgres-multinode-xa pg_isready -U testuser -d defaultdb -h 127.0.0.1; do sleep 2; done'

          # Verify XA setting
          PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SHOW max_prepared_transactions;"

      - name: Set up JDK 22 for build
        uses: actions/setup-java@v4
        with:
          java-version: 22
          distribution: 'temurin'
          cache: maven

      - name: Build and Install (ojp-grpc-commons) with JDK 22
        run: mvn clean install -pl ojp-grpc-commons -am -DskipTests -Dgpg.skip=true

      - name: Test (ojp-grpc-commons) with JDK 22
        run: mvn test -pl ojp-grpc-commons -Dgpg.skip=true

      - name: Build (ojp-server) with JDK 22
        run: mvn clean install -pl ojp-server -am -DskipTests -Dgpg.skip=true

      - name: Start OJP Server 1 on port 10591 with XA support
        run: |
          # Start first server on port 10591 with Prometheus on 9159
          nohup java -Dojp.server.port=10591 -Dojp.prometheus.port=9159 -jar ojp-server/target/ojp-server-0.2.1-snapshot-shaded.jar > /tmp/ojp-server-1.log 2>&1 &
          echo $! > /tmp/ojp-server-1.pid
          echo "Started OJP Server 1 on gRPC port 10591, Prometheus port 9159 with PID $(cat /tmp/ojp-server-1.pid)"

      - name: Start OJP Server 2 on port 10592 with XA support
        run: |
          # Start second server on port 10592 with Prometheus on 9160
          nohup java -Dojp.server.port=10592 -Dojp.prometheus.port=9160 -jar ojp-server/target/ojp-server-0.2.1-snapshot-shaded.jar > /tmp/ojp-server-2.log 2>&1 &
          echo $! > /tmp/ojp-server-2.pid
          echo "Started OJP Server 2 on gRPC port 10592, Prometheus port 9160 with PID $(cat /tmp/ojp-server-2.pid)"

      - name: Wait for OJP servers to start
        run: |
          echo "Waiting for servers to start..."
          sleep 15
          echo "Checking if servers are listening..."
          netstat -tuln | grep -E ':(10591|10592)' || echo "Warning: Servers might not be listening yet"

      - name: Build (ojp-jdbc-driver) with JDK 22
        run: mvn clean install -pl ojp-jdbc-driver -am -DskipTests -Dgpg.skip=true

      - name: Create temp directory for test logs
        run: mkdir -p temp

      - name: Start MultinodeXAIntegrationTest with nohup
        run: |
          echo "Starting MultinodeXAIntegrationTest in background..."
          nohup mvn test -pl ojp-jdbc-driver -Dtest=MultinodeXAIntegrationTest -DmultinodeTestsEnabled=true -DuseXA=true -Dgpg.skip=true > temp/MultinodeXAIntegrationTest.log 2>&1 &
          echo $! > temp/multinode-xa-test.pid
          echo "MultinodeXAIntegrationTest started with PID $(cat temp/multinode-xa-test.pid)"
          # Give test time to start
          sleep 20

      - name: Check PostgreSQL connections during XA test
        run: |
          echo "Checking PostgreSQL connections during XA test..."
          TIMEOUT=30
          ELAPSED=0
          EXPECTED=20
          TOLERANCE=2
          MIN_ACCEPTABLE=$((EXPECTED - TOLERANCE))
          MAX_ACCEPTABLE=$((EXPECTED + TOLERANCE))
          MAX_LIMIT=$((EXPECTED + 5))
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            CONNECTION_COUNT=$(PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -t -c "SELECT COUNT(*) FROM pg_stat_activity WHERE datname='defaultdb';")
            CONNECTION_COUNT=$(echo $CONNECTION_COUNT | tr -d '[:space:]')
            echo "Current connections: $CONNECTION_COUNT (elapsed: ${ELAPSED}s)"
            
            if [ "$CONNECTION_COUNT" -ge "$MIN_ACCEPTABLE" ] && [ "$CONNECTION_COUNT" -le "$MAX_LIMIT" ]; then
              echo "✓ Connection count is within expected range: $MIN_ACCEPTABLE ≤ $CONNECTION_COUNT ≤ $MAX_LIMIT (expected: $EXPECTED ± $TOLERANCE)"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              break
            elif [ "$CONNECTION_COUNT" -gt "$MAX_LIMIT" ]; then
              echo "✗ ERROR: Connection count ($CONNECTION_COUNT) exceeds maximum limit of $MAX_LIMIT!"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              exit 1
            else
              echo "Waiting for connections to reach at least $MIN_ACCEPTABLE... (currently: $CONNECTION_COUNT)"
              sleep 2
              ELAPSED=$((ELAPSED + 2))
            fi
          done
          
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "✗ ERROR: Timeout after ${TIMEOUT}s - connection count never reached $MIN_ACCEPTABLE (current: $CONNECTION_COUNT)"
            exit 1
          fi

      - name: Kill OJP Server 1
        run: |
          echo "Killing OJP Server 1..."
          if [ -f /tmp/ojp-server-1.pid ]; then
            kill $(cat /tmp/ojp-server-1.pid) || true
            echo "OJP Server 1 killed"
          fi
          sleep 10

      - name: Check PostgreSQL connections after killing Server 1
        run: |
          echo "Checking PostgreSQL connections after killing Server 1..."
          TIMEOUT=30
          ELAPSED=0
          EXPECTED=20
          TOLERANCE=2
          MIN_ACCEPTABLE=$((EXPECTED - TOLERANCE))
          MAX_ACCEPTABLE=$((EXPECTED + TOLERANCE))
          MAX_LIMIT=$((EXPECTED + 5))
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            CONNECTION_COUNT=$(PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -t -c "SELECT COUNT(*) FROM pg_stat_activity WHERE datname='defaultdb';")
            CONNECTION_COUNT=$(echo $CONNECTION_COUNT | tr -d '[:space:]')
            echo "Current connections: $CONNECTION_COUNT (elapsed: ${ELAPSED}s)"
            
            if [ "$CONNECTION_COUNT" -ge "$MIN_ACCEPTABLE" ] && [ "$CONNECTION_COUNT" -le "$MAX_LIMIT" ]; then
              echo "✓ Connection count is within expected range: $MIN_ACCEPTABLE ≤ $CONNECTION_COUNT ≤ $MAX_LIMIT (expected: $EXPECTED ± $TOLERANCE)"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              break
            elif [ "$CONNECTION_COUNT" -gt "$MAX_LIMIT" ]; then
              echo "✗ ERROR: Connection count ($CONNECTION_COUNT) exceeds maximum limit of $MAX_LIMIT!"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              exit 1
            else
              echo "Waiting for connections to reach at least $MIN_ACCEPTABLE... (currently: $CONNECTION_COUNT)"
              sleep 2
              ELAPSED=$((ELAPSED + 2))
            fi
          done
          
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "✗ ERROR: Timeout after ${TIMEOUT}s - connection count never reached $MIN_ACCEPTABLE (current: $CONNECTION_COUNT)"
            exit 1
          fi

      - name: Restart OJP Server 1 with XA support
        run: |
          echo "Restarting OJP Server 1..."
          nohup java -Dojp.server.port=10591 -Dojp.prometheus.port=9159 -jar ojp-server/target/ojp-server-0.2.1-snapshot-shaded.jar > /tmp/ojp-server-1-restart.log 2>&1 &
          echo $! > /tmp/ojp-server-1-restart.pid
          echo "OJP Server 1 restarted with PID $(cat /tmp/ojp-server-1-restart.pid)"
          sleep 10

      - name: Check PostgreSQL connections after restarting Server 1
        run: |
          echo "Checking PostgreSQL connections after restarting Server 1..."
          TIMEOUT=30
          ELAPSED=0
          EXPECTED=20
          TOLERANCE=2
          MIN_ACCEPTABLE=$((EXPECTED - TOLERANCE))
          MAX_ACCEPTABLE=$((EXPECTED + TOLERANCE))
          MAX_LIMIT=$((EXPECTED + 5))
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            CONNECTION_COUNT=$(PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -t -c "SELECT COUNT(*) FROM pg_stat_activity WHERE datname='defaultdb';")
            CONNECTION_COUNT=$(echo $CONNECTION_COUNT | tr -d '[:space:]')
            echo "Current connections: $CONNECTION_COUNT (elapsed: ${ELAPSED}s)"
            
            if [ "$CONNECTION_COUNT" -ge "$MIN_ACCEPTABLE" ] && [ "$CONNECTION_COUNT" -le "$MAX_LIMIT" ]; then
              echo "✓ Connection count is within expected range: $MIN_ACCEPTABLE ≤ $CONNECTION_COUNT ≤ $MAX_LIMIT (expected: $EXPECTED ± $TOLERANCE)"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              break
            elif [ "$CONNECTION_COUNT" -gt "$MAX_LIMIT" ]; then
              echo "✗ ERROR: Connection count ($CONNECTION_COUNT) exceeds maximum limit of $MAX_LIMIT!"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              exit 1
            else
              echo "Waiting for connections to reach at least $MIN_ACCEPTABLE... (currently: $CONNECTION_COUNT)"
              sleep 2
              ELAPSED=$((ELAPSED + 2))
            fi
          done
          
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "✗ ERROR: Timeout after ${TIMEOUT}s - connection count never reached $MIN_ACCEPTABLE (current: $CONNECTION_COUNT)"
            exit 1
          fi

      - name: Kill OJP Server 2
        run: |
          echo "Killing OJP Server 2..."
          if [ -f /tmp/ojp-server-2.pid ]; then
            kill $(cat /tmp/ojp-server-2.pid) || true
            echo "OJP Server 2 killed"
          fi
          sleep 10

      - name: Check PostgreSQL connections after killing Server 2
        run: |
          echo "Checking PostgreSQL connections after killing Server 2..."
          TIMEOUT=30
          ELAPSED=0
          EXPECTED=20
          TOLERANCE=2
          MIN_ACCEPTABLE=$((EXPECTED - TOLERANCE))
          MAX_ACCEPTABLE=$((EXPECTED + TOLERANCE))
          MAX_LIMIT=$((EXPECTED + 5))
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            CONNECTION_COUNT=$(PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -t -c "SELECT COUNT(*) FROM pg_stat_activity WHERE datname='defaultdb';")
            CONNECTION_COUNT=$(echo $CONNECTION_COUNT | tr -d '[:space:]')
            echo "Current connections: $CONNECTION_COUNT (elapsed: ${ELAPSED}s)"
            
            if [ "$CONNECTION_COUNT" -ge "$MIN_ACCEPTABLE" ] && [ "$CONNECTION_COUNT" -le "$MAX_LIMIT" ]; then
              echo "✓ Connection count is within expected range: $MIN_ACCEPTABLE ≤ $CONNECTION_COUNT ≤ $MAX_LIMIT (expected: $EXPECTED ± $TOLERANCE)"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              break
            elif [ "$CONNECTION_COUNT" -gt "$MAX_LIMIT" ]; then
              echo "✗ ERROR: Connection count ($CONNECTION_COUNT) exceeds maximum limit of $MAX_LIMIT!"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              exit 1
            else
              echo "Waiting for connections to reach at least $MIN_ACCEPTABLE... (currently: $CONNECTION_COUNT)"
              sleep 2
              ELAPSED=$((ELAPSED + 2))
            fi
          done
          
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "✗ ERROR: Timeout after ${TIMEOUT}s - connection count never reached $MIN_ACCEPTABLE (current: $CONNECTION_COUNT)"
            exit 1
          fi

      - name: Restart OJP Server 2 with XA support
        run: |
          echo "Restarting OJP Server 2..."
          nohup java -Dojp.server.port=10592 -Dojp.prometheus.port=9160 -jar ojp-server/target/ojp-server-0.2.1-snapshot-shaded.jar > /tmp/ojp-server-2-restart.log 2>&1 &
          echo $! > /tmp/ojp-server-2-restart.pid
          echo "OJP Server 2 restarted with PID $(cat /tmp/ojp-server-2-restart.pid)"
          sleep 10

      - name: Check PostgreSQL connections after restarting Server 2
        run: |
          echo "Checking PostgreSQL connections after restarting Server 2..."
          TIMEOUT=30
          ELAPSED=0
          EXPECTED=20
          TOLERANCE=2
          MIN_ACCEPTABLE=$((EXPECTED - TOLERANCE))
          MAX_ACCEPTABLE=$((EXPECTED + TOLERANCE))
          MAX_LIMIT=$((EXPECTED + 5))
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            CONNECTION_COUNT=$(PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -t -c "SELECT COUNT(*) FROM pg_stat_activity WHERE datname='defaultdb';")
            CONNECTION_COUNT=$(echo $CONNECTION_COUNT | tr -d '[:space:]')
            echo "Current connections: $CONNECTION_COUNT (elapsed: ${ELAPSED}s)"
            
            if [ "$CONNECTION_COUNT" -ge "$MIN_ACCEPTABLE" ] && [ "$CONNECTION_COUNT" -le "$MAX_LIMIT" ]; then
              echo "✓ Connection count is within expected range: $MIN_ACCEPTABLE ≤ $CONNECTION_COUNT ≤ $MAX_LIMIT (expected: $EXPECTED ± $TOLERANCE)"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              break
            elif [ "$CONNECTION_COUNT" -gt "$MAX_LIMIT" ]; then
              echo "✗ ERROR: Connection count ($CONNECTION_COUNT) exceeds maximum limit of $MAX_LIMIT!"
              PGPASSWORD=testpassword psql -h 127.0.0.1 -U testuser -d defaultdb -c "SELECT datname, COUNT(*) AS connections FROM pg_stat_activity WHERE datname='defaultdb' GROUP BY datname ORDER BY connections DESC;"
              exit 1
            else
              echo "Waiting for connections to reach at least $MIN_ACCEPTABLE... (currently: $CONNECTION_COUNT)"
              sleep 2
              ELAPSED=$((ELAPSED + 2))
            fi
          done
          
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "✗ ERROR: Timeout after ${TIMEOUT}s - connection count never reached $MIN_ACCEPTABLE (current: $CONNECTION_COUNT)"
            exit 1
          fi

      - name: Wait for MultinodeXAIntegrationTest to complete
        run: |
          echo "Waiting for MultinodeXAIntegrationTest to complete..."
          # Wait for test process to finish (max 10 minutes)
          if [ -f temp/multinode-xa-test.pid ]; then
            TEST_PID=$(cat temp/multinode-xa-test.pid)
            TIMEOUT=600
            ELAPSED=0
            while kill -0 $TEST_PID 2>/dev/null && [ $ELAPSED -lt $TIMEOUT ]; do
              echo "Test still running... (${ELAPSED}s elapsed)"
              sleep 10
              ELAPSED=$((ELAPSED + 10))
            done
            
            if kill -0 $TEST_PID 2>/dev/null; then
              echo "Test did not complete within timeout, terminating..."
              kill $TEST_PID || true
            else
              echo "Test completed successfully"
            fi
          fi

      - name: Verify test results
        run: |
          echo "Checking MultinodeXAIntegrationTest results..."
          if grep -q "BUILD SUCCESS" temp/MultinodeXAIntegrationTest.log; then
            echo "✓ Test passed successfully"
          elif grep -q "BUILD FAILURE" temp/MultinodeXAIntegrationTest.log; then
            echo "✗ Test failed"
            exit 1
          else
            echo "⚠ Could not determine test status"
          fi

      - name: Validate Atomikos pool logs
        run: |
          echo "Validating Atomikos pool creation/recreation logs..."
          
          # Combine all server logs
          cat /tmp/ojp-server-1.log /tmp/ojp-server-1-restart.log /tmp/ojp-server-2.log /tmp/ojp-server-2-restart.log > /tmp/all-server-logs.txt 2>/dev/null || true
          
          # Search for Atomikos pool creation messages
          echo "Searching for 'Atomikos pool created' messages..."
          POOL_CREATED_COUNT=$(grep -c "Atomikos pool created:" /tmp/all-server-logs.txt || echo "0")
          echo "Found $POOL_CREATED_COUNT 'Atomikos pool created' messages"
          
          # Search for Atomikos pool recreation messages
          echo "Searching for 'Atomikos pool recreated' messages..."
          POOL_RECREATED_COUNT=$(grep -c "Atomikos pool recreated:" /tmp/all-server-logs.txt || echo "0")
          echo "Found $POOL_RECREATED_COUNT 'Atomikos pool recreated' messages"
          
          # Display the actual log lines
          echo ""
          echo "=== Atomikos Pool Creation Logs ==="
          grep "Atomikos pool created:" /tmp/all-server-logs.txt || echo "No pool creation messages found"
          
          echo ""
          echo "=== Atomikos Pool Recreation Logs ==="
          grep "Atomikos pool recreated:" /tmp/all-server-logs.txt || echo "No pool recreation messages found"
          
          # Validate expected pool size is present in logs
          echo ""
          echo "Validating expected maxSize=$EXPECTED_ATOMIKOS_MAX_POOL in logs..."
          if grep -q "maxSize=$EXPECTED_ATOMIKOS_MAX_POOL" /tmp/all-server-logs.txt; then
            echo "✓ Found expected maxSize=$EXPECTED_ATOMIKOS_MAX_POOL in Atomikos logs"
          else
            echo "✗ ERROR: Expected maxSize=$EXPECTED_ATOMIKOS_MAX_POOL not found in Atomikos logs"
            echo "Showing all maxSize values found:"
            grep -o "maxSize=[0-9]*" /tmp/all-server-logs.txt | sort -u || echo "No maxSize values found"
            exit 1
          fi
          
          # Fail if no Atomikos messages found at all
          TOTAL_ATOMIKOS_MESSAGES=$((POOL_CREATED_COUNT + POOL_RECREATED_COUNT))
          if [ $TOTAL_ATOMIKOS_MESSAGES -eq 0 ]; then
            echo "✗ ERROR: No Atomikos pool creation or recreation messages found in server logs"
            exit 1
          fi
          
          echo ""
          echo "✓ Atomikos pool validation passed: found $TOTAL_ATOMIKOS_MESSAGES total messages with expected pool size"

      - name: Show OJP Server 1 log
        if: always()
        run: |
          echo "=== OJP Server 1 Initial Log ==="
          cat /tmp/ojp-server-1.log || echo "/tmp/ojp-server-1.log not found"
          echo ""
          echo "=== OJP Server 1 Restart Log ==="
          cat /tmp/ojp-server-1-restart.log || echo "/tmp/ojp-server-1-restart.log not found"

      - name: Show OJP Server 2 log
        if: always()
        run: |
          echo "=== OJP Server 2 Initial Log ==="
          cat /tmp/ojp-server-2.log || echo "/tmp/ojp-server-2.log not found"
          echo ""
          echo "=== OJP Server 2 Restart Log ==="
          cat /tmp/ojp-server-2-restart.log || echo "/tmp/ojp-server-2-restart.log not found"

      - name: Show MultinodeXAIntegrationTest log
        if: always()
        run: |
          echo "=== MultinodeXAIntegrationTest Log ==="
          cat temp/MultinodeXAIntegrationTest.log || echo "temp/MultinodeXAIntegrationTest.log not found"

      - name: Upload logs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multinode-xa-test-logs
          path: |
            /tmp/ojp-server-*.log
            temp/MultinodeXAIntegrationTest.log
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          # Kill any remaining OJP server processes
          pkill -f "ojp-server-0.2.1-snapshot-shaded.jar" || true
          # Stop Postgres container
          docker stop ojp-postgres-multinode-xa || true
          docker rm ojp-postgres-multinode-xa || true
